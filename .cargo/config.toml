[registries.wired-square]
index = "sparse+https://forge.wiredsquare.com/api/packages/wired-square/cargo/"

# Where `ts(export)` writes when a test runs. Under `target/`, so a test run
# leaves the tree clean; set the variable to send it elsewhere.
[env]
TS_RS_EXPORT_DIR = { value = "target/ts-rs", relative = true }
