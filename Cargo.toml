[workspace]
resolver = "3"
members = ["crates/*"]

# Each crate carries its own `version`; nothing here is lockstep.
[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Wired Square <apps@wiredsquare.com>"]
repository = "https://github.com/Wired-Square/wslib-rs"

# RSA key generation in the tests takes minutes unoptimised.
[profile.dev.package.num-bigint-dig]
opt-level = 3
