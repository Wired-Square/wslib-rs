[package]
name = "wslib-api-error"
version = "0.1.0"
description = "One error body on the wire for every HTTP API, and the axum error that answers it."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = ["axum"]
axum = ["dep:axum"]
# 11, not 12: a field's `TS` must come from the same ts-rs as its container's,
# and the chassis derives with 11.
ts = ["dep:ts-rs"]

[dependencies]
http = "1.1"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.85"
tracing = "0.1.41"
axum = { version = "0.8", default-features = false, features = ["json", "query"], optional = true }
ts-rs = { version = "11.1", features = ["serde-json-impl"], optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query"] }
http-body-util = "0.1"
tokio = { version = "1.47", features = ["macros", "rt"] }
tower = { version = "0.5.2", features = ["util"] }
