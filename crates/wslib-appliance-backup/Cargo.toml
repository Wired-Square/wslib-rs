[package]
name = "wslib-appliance-backup"
version = "0.1.1"
description = "An appliance backup's sealed file, its sections, its routes and its schedule, on any of the appliance backends."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
axum = { version = "0.8.7", default-features = false, features = ["json"] }
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde", "std"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3"
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.85"
subtle = { version = "2.5", default-features = false }
thiserror = "2"
tokio = { version = "1.47", default-features = false, features = ["fs", "rt", "sync", "time"] }
tracing = "0.1.41"
wslib-appliance-core = { path = "../wslib-appliance-core", version = "0.1.1", registry = "wired-square" }
wslib-appliance-store = { path = "../wslib-appliance-store", version = "0.1.1", registry = "wired-square" }
wslib-appliance-types = { path = "../wslib-appliance-types", version = "0.1.1", registry = "wired-square" }
wslib-file-atomic = { path = "../wslib-file-atomic", version = "0.1.6", registry = "wired-square" }
wslib-http-scaffold = { path = "../wslib-http-scaffold", version = "0.1.3", registry = "wired-square", default-features = false, features = ["server"] }
wslib-secret = { path = "../wslib-secret", version = "0.1.1", registry = "wired-square" }

[dev-dependencies]
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
tempfile = "3.10.1"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
wslib-appliance-auth = { path = "../wslib-appliance-auth", version = "0.1.1", registry = "wired-square" }
wslib-appliance-core = { path = "../wslib-appliance-core", version = "0.1.1", registry = "wired-square", features = ["testing"] }
wslib-appliance-https = { path = "../wslib-appliance-https", version = "0.1.1", registry = "wired-square", features = ["testing"] }
wslib-appliance-server = { path = "../wslib-appliance-server", version = "0.1.1", registry = "wired-square", features = ["testing"] }
wslib-auth-totp = { path = "../wslib-auth-totp", version = "0.1.1", registry = "wired-square", features = ["codes"] }
