[package]
name = "wslib-appliance-core"
version = "0.1.4"
description = "The router, the authority and the workers an appliance needs, beneath the backends that serve them behind a console, on their own TLS listener and as a desktop service."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
testing = [
    "dep:libc",
    "dep:wslib-auth-passkey",
    "wslib-auth-passkey/testing",
    "wslib-telemetry/test-support",
    "wslib-tls/testing",
]
sessions = []

[dependencies]
axum = { version = "0.8.7", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "serde", "std"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false }
hyper-util = { version = "0.1.18", default-features = false, features = ["tokio"] }
rustls = { version = "0.23.27", default-features = false, features = ["logging", "std", "tls12"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.85"
sha2 = { version = "0.10.9", default-features = false }
thiserror = "2"
tokio = { version = "1.47", default-features = false, features = ["net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["registry", "std"] }
uuid = { version = "1.1", default-features = false }
wslib-appliance-auth = { path = "../wslib-appliance-auth", version = "0.1.1", registry = "wired-square" }
wslib-appliance-config = { path = "../wslib-appliance-config", version = "0.1.1", registry = "wired-square" }
wslib-appliance-store = { path = "../wslib-appliance-store", version = "0.1.1", registry = "wired-square" }
wslib-appliance-types = { path = "../wslib-appliance-types", version = "0.1.1", registry = "wired-square" }
wslib-auth = { path = "../wslib-auth", version = "0.1.1", registry = "wired-square", default-features = false }
wslib-auth-passkey = { path = "../wslib-auth-passkey", version = "0.1.0", registry = "wired-square", default-features = false, optional = true }
wslib-crypto = { path = "../wslib-crypto", version = "0.1.0", registry = "wired-square" }
wslib-crypto-x509 = { path = "../wslib-crypto-x509", version = "0.1.5", registry = "wired-square" }
wslib-file-atomic = { path = "../wslib-file-atomic", version = "0.1.6", registry = "wired-square" }
wslib-homeassistant = { path = "../wslib-homeassistant", version = "0.1.0", registry = "wired-square" }
wslib-host = { path = "../wslib-host", version = "0.1.1", registry = "wired-square" }
wslib-http-error = { path = "../wslib-http-error", version = "0.1.1", registry = "wired-square", default-features = false, features = ["axum"] }
wslib-http-server = { path = "../wslib-http-server", version = "0.1.7", registry = "wired-square" }
wslib-http-scaffold = { path = "../wslib-http-scaffold", version = "0.1.3", registry = "wired-square", default-features = false, features = ["server"] }
wslib-secret = { path = "../wslib-secret", version = "0.1.1", registry = "wired-square" }
wslib-service = { path = "../wslib-service", version = "0.1.3", registry = "wired-square" }
wslib-telemetry = { path = "../wslib-telemetry", version = "0.1.9", registry = "wired-square", default-features = false, features = ["journald", "ring"] }
wslib-tls = { path = "../wslib-tls", version = "0.2.4", registry = "wired-square" }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.183", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
] }

[dev-dependencies]
hyper = { version = "1.8", default-features = false }
rcgen = { version = "0.14.10", default-features = false }
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
tempfile = "3.10.1"
tokio = { version = "1.47", features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false }
wslib-auth-passkey = { path = "../wslib-auth-passkey", version = "0.1.0", registry = "wired-square", features = ["testing"] }
wslib-auth-totp = { path = "../wslib-auth-totp", version = "0.1.1", registry = "wired-square", features = ["codes"] }
wslib-telemetry = { path = "../wslib-telemetry", version = "0.1.9", registry = "wired-square", default-features = false, features = ["test-support"] }
wslib-tls = { path = "../wslib-tls", version = "0.2.4", registry = "wired-square", features = ["testing"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.183"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }
