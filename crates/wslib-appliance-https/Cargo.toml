[package]
name = "wslib-appliance-https"
version = "0.1.1"
description = "The HTTP surface of an appliance that serves its own browser: TLS, the redirect, the control socket, sessions, sign-in and the first account."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
testing = ["wslib-appliance-core/testing", "dep:tempfile"]

[dependencies]
# No `form`: every request body is JSON, so the CSRF story is one story.
axum = { version = "0.8.7", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
serde_json = "1.0.85"
tempfile = { version = "3.10.1", optional = true }
tokio = { version = "1.47", default-features = false, features = ["rt", "sync"] }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1.41"
wslib-appliance-auth = { path = "../wslib-appliance-auth", version = "0.1.1", registry = "wired-square" }
wslib-appliance-config = { path = "../wslib-appliance-config", version = "0.1.1", registry = "wired-square" }
wslib-appliance-core = { path = "../wslib-appliance-core", version = "0.1.1", registry = "wired-square", features = ["sessions"] }
wslib-appliance-store = { path = "../wslib-appliance-store", version = "0.1.1", registry = "wired-square" }
wslib-appliance-types = { path = "../wslib-appliance-types", version = "0.1.1", registry = "wired-square" }
wslib-auth = { path = "../wslib-auth", version = "0.1.1", registry = "wired-square", default-features = false }
wslib-http-server = { path = "../wslib-http-server", version = "0.1.1", registry = "wired-square" }
wslib-secret = { path = "../wslib-secret", version = "0.1.1", registry = "wired-square" }

[dev-dependencies]
h2 = { version = "0.4.2", default-features = false }
rustls = { version = "0.23.27", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tempfile = "3.10.1"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26", default-features = false }
wslib-appliance-core = { path = "../wslib-appliance-core", version = "0.1.1", registry = "wired-square", features = ["sessions", "testing"] }
wslib-appliance-server = { path = "../wslib-appliance-server", version = "0.1.1", registry = "wired-square", features = ["testing"] }
wslib-auth-totp = { path = "../wslib-auth-totp", version = "0.1.1", registry = "wired-square", features = ["codes"] }
wslib-service = { path = "../wslib-service", version = "0.1.3", registry = "wired-square", features = ["testing"] }
wslib-telemetry = { path = "../wslib-telemetry", version = "0.1.9", registry = "wired-square", default-features = false, features = ["journald", "ring"] }
