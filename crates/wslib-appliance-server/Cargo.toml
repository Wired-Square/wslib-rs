[package]
name = "wslib-appliance-server"
version = "0.1.6"
description = "An appliance's HTTP surface behind a console's app and hooks sockets or Home Assistant's ingress proxy: an authorisation extractor per rung, and the daemon's own log."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
testing = ["wslib-appliance-core/testing", "dep:tempfile"]

[dependencies]
axum = { version = "0.8.7", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
tempfile = { version = "3.10.1", optional = true }
tokio = { version = "1.47", default-features = false, features = ["net", "rt", "time"] }
tokio-util = { version = "0.7.19", default-features = false }
tracing = "0.1.41"
wslib-appliance-config = { path = "../wslib-appliance-config", version = "0.1.1", registry = "wired-square" }
wslib-appliance-core = { path = "../wslib-appliance-core", version = "=0.1.6", registry = "wired-square" }
wslib-appliance-store = { path = "../wslib-appliance-store", version = "0.1.1", registry = "wired-square" }
wslib-appliance-types = { path = "../wslib-appliance-types", version = "0.1.1", registry = "wired-square" }
wslib-homeassistant = { path = "../wslib-homeassistant", version = "0.1.0", registry = "wired-square" }

[dev-dependencies]
axum = { version = "0.8.7", default-features = false, features = ["macros"] }
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false }
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
serde_json = "1.0.85"
tempfile = "3.10.1"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "test-util"] }
wslib-appliance-core = { path = "../wslib-appliance-core", version = "=0.1.6", registry = "wired-square", features = ["testing"] }
wslib-service = { path = "../wslib-service", version = "0.1.3", registry = "wired-square", features = ["testing"] }
wslib-telemetry = { path = "../wslib-telemetry", version = "0.1.9", registry = "wired-square", default-features = false, features = ["journald", "ring"] }
