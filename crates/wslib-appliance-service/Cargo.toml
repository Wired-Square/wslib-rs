[package]
name = "wslib-appliance-service"
version = "0.1.1"
description = "An appliance as a background service on a desktop: the same router, served on control endpoints, each with a role ceiling, and nothing else."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
testing = ["wslib-appliance-core/testing", "dep:serde_json", "dep:tempfile", "dep:wslib-file-atomic", "tokio/io-util", "tokio/macros", "tokio/net"]

[dependencies]
axum = { version = "0.8.7", default-features = false }
serde_json = { version = "1.0.85", optional = true }
tempfile = { version = "3.10.1", optional = true }
thiserror = "2"
tokio = { version = "1.47", default-features = false, features = ["sync", "time"] }
wslib-appliance-core = { path = "../wslib-appliance-core", version = "=0.1.1", registry = "wired-square" }
wslib-appliance-store = { path = "../wslib-appliance-store", version = "0.1.1", registry = "wired-square" }
wslib-appliance-types = { path = "../wslib-appliance-types", version = "0.1.1", registry = "wired-square" }
wslib-service = { path = "../wslib-service", version = "0.1.3", registry = "wired-square" }
wslib-telemetry = { path = "../wslib-telemetry", version = "0.1.9", registry = "wired-square", default-features = false, features = ["setup"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.174"

[target.'cfg(windows)'.dependencies]
wslib-file-atomic = { path = "../wslib-file-atomic", version = "0.1.6", registry = "wired-square", optional = true }

[dev-dependencies]
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
serde_json = "1.0.85"
tempfile = "3.10.1"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1.41"
wslib-appliance-core = { path = "../wslib-appliance-core", version = "=0.1.1", registry = "wired-square", features = ["testing"] }

[target.'cfg(windows)'.dev-dependencies]
wslib-file-atomic = { path = "../wslib-file-atomic", version = "0.1.6", registry = "wired-square" }
