[package]
name = "wslib-appliance-store"
version = "0.1.0"
description = "An appliance's database: the tables every appliance has, in one SQLite file a product's own tables share."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
serde = "1.0.225"
serde_json = "1.0.85"
sqlx = { version = "0.8.5", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1.47", default-features = false, features = ["sync", "time"] }
tracing = "0.1.41"
uuid = { version = "1", features = ["v4"] }
wslib-appliance-types = { path = "../wslib-appliance-types", version = "0.1.0", registry = "wired-square" }
wslib-auth = { path = "../wslib-auth", version = "0.1.1", registry = "wired-square", default-features = false, features = ["sqlite"] }
wslib-db-sqlite = { path = "../wslib-db-sqlite", version = "0.1.0", registry = "wired-square" }
wslib-file-atomic = { path = "../wslib-file-atomic", version = "0.1", registry = "wired-square" }
wslib-secret = { path = "../wslib-secret", version = "0.1.0", registry = "wired-square" }

[dev-dependencies]
serde = { version = "1.0.225", features = ["derive"] }
tempfile = "3.10.1"
tokio = { version = "1.47", features = ["macros", "rt"] }

[target.'cfg(windows)'.dev-dependencies]
wslib-file-atomic = { path = "../wslib-file-atomic", version = "0.1.3", registry = "wired-square", features = ["testing"] }
