[package]
name = "wslib-appliance-types"
version = "0.1.0"
description = "An appliance's wire contract: the types its daemon, its browser and any other client share."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
# 11, not 12: a field's `TS` must come from the same ts-rs as its container's.
ts = [
    "dep:ts-rs",
    "wslib-auth-passkey/ts",
    "wslib-auth-totp/ts",
    "wslib-http-error/ts",
    "wslib-secret/ts",
    "wslib-telemetry/ts",
]

[dependencies]
chrono = { version = "0.4.39", default-features = false, features = ["serde"] }
serde = { version = "1.0.225", features = ["derive"] }
thiserror = "2"
ts-rs = { version = "11.1", features = ["chrono-impl"], optional = true }
wslib-auth-passkey = { path = "../wslib-auth-passkey", version = "0.1.0", registry = "wired-square", default-features = false }
wslib-auth-totp = { path = "../wslib-auth-totp", version = "0.1.0", registry = "wired-square", default-features = false, features = ["serde"] }
wslib-http-error = { path = "../wslib-http-error", version = "0.1.0", registry = "wired-square", default-features = false }
wslib-secret = { path = "../wslib-secret", version = "0.1.1", registry = "wired-square", features = ["serde"] }
wslib-telemetry = { path = "../wslib-telemetry", version = "0.1.0", registry = "wired-square", default-features = false, features = ["types"] }

[dev-dependencies]
serde_json = "1.0.85"
