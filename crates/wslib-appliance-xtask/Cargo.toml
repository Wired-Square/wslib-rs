[package]
name = "wslib-appliance-xtask"
version = "0.2.7"
description = "Renders a product's packaging scaffolding from appliance.toml, and stands in for a console in development."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.85"
thiserror = "2"
toml = "1"
wslib-appliance-types = { path = "../wslib-appliance-types", version = "0.1.5", registry = "wired-square" }
wslib-build-id = { path = "../wslib-build-id", version = "0.1.0", registry = "wired-square" }

[target.'cfg(unix)'.dependencies]
chrono = { version = "0.4.39", default-features = false }
http-body-util = { version = "0.1", default-features = false }
hyper = { version = "1.8", default-features = false, features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.18", default-features = false, features = ["tokio"] }
tokio = { version = "1.47", default-features = false, features = ["net", "rt"] }

[build-dependencies]
wslib-build-id = { path = "../wslib-build-id", version = "0.1.0", registry = "wired-square" }

[dev-dependencies]
tempfile = "3.10.1"
# The tests ask it where a packaged bundle and config live; as a normal
# dependency it would add seven crates.
wslib-appliance-config = { path = "../wslib-appliance-config", version = "0.1.1", registry = "wired-square" }

[target.'cfg(unix)'.dev-dependencies]
rustls = { version = "0.23.27", default-features = false, features = ["ring"] }
tokio = { version = "1.47", features = ["io-util", "macros"] }
wslib-appliance-server = { path = "../wslib-appliance-server", version = "0.1.0", registry = "wired-square", features = ["testing"] }
