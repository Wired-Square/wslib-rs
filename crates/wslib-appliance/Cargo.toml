[package]
name = "wslib-appliance"
version = "0.1.6"
description = "The appliance family in one dependency: its wire types and bootstrap settings, and each other crate behind a feature."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
ts = ["wslib-appliance-types/ts"]
store = ["dep:wslib-appliance-store"]
auth = ["store", "dep:wslib-appliance-auth"]
core = ["auth", "dep:wslib-appliance-core"]
server = ["core", "dep:wslib-appliance-server"]
https = ["core", "dep:wslib-appliance-https"]
service = ["core", "dep:wslib-appliance-service"]
backup = ["core", "dep:wslib-appliance-backup"]
client = ["dep:wslib-appliance-client"]

[dependencies]
wslib-appliance-auth = { path = "../wslib-appliance-auth", version = "=0.1.1", registry = "wired-square", optional = true }
wslib-appliance-core = { path = "../wslib-appliance-core", version = "=0.1.2", registry = "wired-square", optional = true }
wslib-appliance-server = { path = "../wslib-appliance-server", version = "=0.1.2", registry = "wired-square", optional = true }
wslib-appliance-https = { path = "../wslib-appliance-https", version = "=0.1.2", registry = "wired-square", optional = true }
wslib-appliance-service = { path = "../wslib-appliance-service", version = "=0.1.2", registry = "wired-square", optional = true }
wslib-appliance-backup = { path = "../wslib-appliance-backup", version = "=0.1.2", registry = "wired-square", optional = true }
wslib-appliance-client = { path = "../wslib-appliance-client", version = "=0.1.1", registry = "wired-square", optional = true }
wslib-appliance-config = { path = "../wslib-appliance-config", version = "=0.1.2", registry = "wired-square" }
wslib-appliance-store = { path = "../wslib-appliance-store", version = "=0.1.2", registry = "wired-square", optional = true }
wslib-appliance-types = { path = "../wslib-appliance-types", version = "=0.1.3", registry = "wired-square" }
