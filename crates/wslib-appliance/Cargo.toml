[package]
name = "wslib-appliance"
version = "0.1.0"
description = "The appliance family in one dependency: its wire types and its bootstrap settings."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
ts = ["wslib-appliance-types/ts"]

[dependencies]
wslib-appliance-config = { path = "../wslib-appliance-config", version = "=0.1.0", registry = "wired-square" }
wslib-appliance-types = { path = "../wslib-appliance-types", version = "=0.1.0", registry = "wired-square" }
