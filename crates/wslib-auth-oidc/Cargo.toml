[package]
name = "wslib-auth-oidc"
version = "0.1.0"
description = "Verifies OIDC ID tokens (RS256) against an issuer's JWKS, with a key cache that refetches on rotation without hammering the issuer."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
jsonwebtoken = { version = "11.1", default-features = false }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider"] }
serde = "1.0.228"
serde_json = "1.0.120"
tokio = { version = "1.47", default-features = false, features = ["sync"] }

[dev-dependencies]
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
