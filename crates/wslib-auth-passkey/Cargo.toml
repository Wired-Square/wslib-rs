[package]
name = "wslib-auth-passkey"
version = "0.1.0"
description = "Passkeys: the WebAuthn registration and authentication ceremonies, verified with no attestation, ES256 and EdDSA, the user verified every time."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = ["ceremonies"]
# The ceremonies and their crypto. Off, only the JSON types are left, on serde.
ceremonies = ["dep:base64", "dep:ed25519-dalek", "dep:getrandom", "dep:p256", "dep:serde_json", "dep:sha2"]
# A software passkey that answers a ceremony's options as a browser's would.
testing = ["ceremonies"]
ts = ["dep:ts-rs"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"], optional = true }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"], optional = true }
getrandom = { version = "0.3", features = ["std"], optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"], optional = true }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = { version = "1.0.85", optional = true }
sha2 = { version = "0.10.9", optional = true }
ts-rs = { version = "11.1", optional = true }

[dev-dependencies]
serde_json = "1.0.85"
