[package]
name = "wslib-auth-totp"
version = "0.1.0"
description = "TOTP (RFC 6238) for an authenticator app: keys, the otpauth URI, the code check and the clock-skew check."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = []
serde = ["dep:serde"]
ts = ["serde", "dep:ts-rs"]

[dependencies]
getrandom = { version = "0.3", features = ["std"] }
hmac = "0.12.1"
serde = { version = "1.0.225", features = ["derive"], optional = true }
sha1 = "0.10.6"
subtle = { version = "2.5", default-features = false }
ts-rs = { version = "11.1", optional = true }
wslib-secret = { path = "../wslib-secret", version = "0.1.1", registry = "wired-square" }

[dev-dependencies]
serde_json = "1.0.85"
