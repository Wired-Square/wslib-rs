[package]
name = "wslib-backoff"
version = "0.1.2"
description = "Capped exponential backoff that restarts on success, with an optional async retry loop."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1.53.3", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt", "test-util", "time"] }
