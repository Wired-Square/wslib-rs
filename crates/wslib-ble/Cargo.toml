[package]
name = "wslib-ble"
version = "0.1.0"
description = "Bluetooth LE pairing on a host with no agent: confirms a Just Works pairing with one named device through BlueZ, and forgets a bond."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
testing = ["dep:zbus", "zbus/p2p", "dep:tokio", "tokio/macros", "tokio/net", "tokio/sync"]

[dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time"], optional = true }
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt", "time"] }

[[test]]
name = "bluez"
required-features = ["testing"]
