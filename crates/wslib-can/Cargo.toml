[package]
name = "wslib-can"
version = "0.1.1"
description = "CAN: the frame on the bus, its data length codes, bit timing, candump and SavvyCAN text, and the task every CAN transport runs, reopening its device with backoff."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
task = ["dep:tokio", "dep:thiserror", "dep:wslib-backoff"]
tcp = ["task", "dep:wslib-tcp"]

[dependencies]
thiserror = { version = "2.0.17", optional = true }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt", "sync", "time"], optional = true }
wslib-backoff = { path = "../wslib-backoff", version = "0.1.2", registry = "wired-square", optional = true }
wslib-tcp = { path = "../wslib-tcp", version = "0.1", registry = "wired-square", optional = true }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["macros", "rt", "time"] }
