[package]
name = "wslib-cli"
version = "0.1.0"
description = "Shared command-line conventions: tables or JSON, exit codes, config discovery and op:// references."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = []
clap = ["dep:clap"]
toml = ["dep:toml"]

[dependencies]
comfy-table = { version = "8.0", default-features = false }
serde = "1.0.225"
serde_json = "1.0.85"
clap = { version = "4.0", default-features = false, features = ["std", "derive"], optional = true }
toml = { version = "1.0", default-features = false, features = ["parse", "serde", "std"], optional = true }

[dev-dependencies]
serde = { version = "1.0.225", features = ["derive"] }
