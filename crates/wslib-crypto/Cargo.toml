[package]
name = "wslib-crypto"
version = "0.1.2"
description = "Keys for X.509 through a rustls CryptoProvider: P-256, P-384 and RSA generation to PKCS#8, an rcgen signer, key identifiers, serials, random bytes and SHA-256 fingerprints."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "pkcs8", "std"] }
pkcs8 = { version = "0.10.2", features = ["std"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
rcgen = { version = "0.14.10", default-features = false }
rsa = { version = "0.9.10", default-features = false, features = ["std"] }
# No provider: the caller's signs, verifies and supplies randomness.
rustls = { version = "0.23.27", default-features = false }
rustls-pki-types = { version = "1.12", features = ["std"] }
sha2 = "0.10.9"

[dev-dependencies]
rustls = { version = "0.23.27", default-features = false, features = ["aws_lc_rs", "ring", "std"] }
