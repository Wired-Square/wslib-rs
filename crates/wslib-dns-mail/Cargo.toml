[package]
name = "wslib-dns-mail"
version = "0.1.0"
description = "Email-authentication records in DNS: lenient parsers with byte-span faults for SPF, DMARC, DKIM keys, BIMI, MTA-STS and TLS-RPT, and record editors."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = []
serde = ["dep:serde", "wslib-dns/serde"]

[dependencies]
wslib-dns = { version = "0.1", path = "../wslib-dns" }
serde = { version = "1.0.225", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.85"
tokio = { version = "1.47", features = ["macros", "rt"] }
wslib-dns = { version = "0.1", path = "../wslib-dns", features = ["hickory", "testing"] }
