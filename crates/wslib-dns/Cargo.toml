[package]
name = "wslib-dns"
version = "0.2.0"
description = "DNS lookups that keep NXDOMAIN, NODATA, SERVFAIL, REFUSED and timeout apart, with hostname, IDNA and Public Suffix List helpers."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = []
hickory = ["dep:hickory-resolver"]
# DNSSEC validation, with the named crypto; the caller picks one.
dnssec-ring = ["hickory", "__dnssec", "hickory-resolver/dnssec-ring"]
dnssec-aws-lc-rs = ["hickory", "__dnssec", "hickory-resolver/dnssec-aws-lc-rs"]
__dnssec = []
serde = ["dep:serde"]
testing = []

[dependencies]
idna = "1.1"
psl = "2.1"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"], optional = true }
serde = { version = "1.0.225", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.85"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "rt", "time"] }

[[test]]
name = "live"
required-features = ["hickory"]

[[test]]
name = "hickory"
required-features = ["hickory"]
