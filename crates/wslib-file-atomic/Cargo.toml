[package]
name = "wslib-file-atomic"
version = "0.1.9"
description = "Crash-safe whole-file writes: replaced whole or not at all, readable by whom it should be from creation."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
testing = ["windows-sys/Win32_System_SystemServices"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }

[[test]]
name = "readers"
required-features = ["testing"]
