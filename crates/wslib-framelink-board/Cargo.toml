[package]
name = "wslib-framelink-board"
version = "0.1.0"
description = "FrameLink board definitions: the TOML schema, its parser and editor, display names, scaffolding from a live device, LED discovery and the embedded boards."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0.225", features = ["derive"] }
thiserror = "2.0.20"
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse", "serde"] }
wslib-framelink-protocol = { path = "../wslib-framelink-protocol", version = "0.1", registry = "wired-square" }

[dev-dependencies]
serde_json = "1.0.85"
