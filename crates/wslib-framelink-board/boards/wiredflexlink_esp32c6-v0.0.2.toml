[board]
name = "wiredflexlink"
revision = "esp32c6-v0.0.2"
description = "Wired Square Flexible Link — ESP32-C6"

# -----------------------------------------------------------------------
# Interface definitions — keyed by target_index from capabilities
# -----------------------------------------------------------------------

[interfaces.0]
name = "CAN0"
type = "can"

[interfaces.1]
name = "CAN1"
type = "can"

[interfaces.2]
name = "RS-485 Port 0"
type = "rs485"

[interfaces.3]
name = "RS-485 Port 1"
type = "rs485"

# -----------------------------------------------------------------------
# Peripheral definitions — keyed by target_index from capabilities
# -----------------------------------------------------------------------

[peripherals.0]
name = "Status LEDs"
kind = "actuator"

[peripherals.1]
name = "VN9D Load Switch"
kind = "actuator"

[peripherals.2]
name = "SoC Temperature"
kind = "sensor"

# -----------------------------------------------------------------------
# Signal definitions — keyed by the semantic tuple
#   <target>.<index>.<role>.<quantity>[.<aspect>][.ch<N>]
# (aspect omitted when default, channel omitted for target-level signals)
# -----------------------------------------------------------------------

