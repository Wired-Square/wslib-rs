# -----------------------------------------------------------------------
# Palettes — colour gradients stored as user signals
# -----------------------------------------------------------------------

[palettes.0]
name = "Temperature"
description = "Blue (cold) to Red (hot)"
signal_start = "0x0200"
entries = [
    "FF0000FF",
    "FF00FFFF",
    "FF00FF00",
    "FFFFFF00",
    "FFFF8000",
    "FFFF0000",
]

[palettes.1]
name = "Signal Strength"
description = "Red (weak) to Green (strong)"
signal_start = "0x0210"
entries = [
    "FFFF0000",
    "FFFF8000",
    "FFFFFF00",
    "FF00FF00",
]

[palettes.2]
name = "Current"
description = "Green (low) through Yellow/Orange to Red (high)"
signal_start = "0x0220"
entries = [
    "FF00FF00",
    "FF40FF00",
    "FF80FF00",
    "FFBFFF00",
    "FFFFFF00",
    "FFFFC000",
    "FFFF8000",
    "FFFF4000",
    "FFFF2000",
    "FFFF0000",
]

# -----------------------------------------------------------------------
# Functions — transformer function descriptions
# -----------------------------------------------------------------------

[functions.0x10]
name = "Palette Lookup"
description = "Normalise signal value and look up color from a palette"
params = ["palette_signal_start:u16", "signal_max:u16"]

[functions.0x11]
name = "Clamp"
description = "Clamp value to min/max range"
params = ["min:u32", "max:u32"]

[functions.0x12]
name = "Threshold"
description = "Output value_above if input >= threshold, else value_below"
params = ["threshold:u32", "value_above:u32", "value_below:u32"]

[functions.0x13]
name = "Gate"
description = "Conditionally pass or zero output based on a guard signal"
params = ["guard_signal_id:u16", "compare_op:u8", "compare_value:u32", "fail_value:u32"]

