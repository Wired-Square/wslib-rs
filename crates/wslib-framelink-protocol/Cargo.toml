[package]
name = "wslib-framelink-protocol"
version = "0.2.0"
description = "The FrameLink protocol, sans-io: frames, messages, the signal vocabulary and its identity tuple, capabilities, rules, file transfer and BLE manufacturer data."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
ts = ["dep:ts-rs"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.20"
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
wslib-checksum = { path = "../wslib-checksum", version = "0.1", registry = "wired-square" }
wslib-framing = { path = "../wslib-framing", version = "0.1", registry = "wired-square" }

[dev-dependencies]
serde_json = "1.0.85"
