[package]
name = "wslib-host"
version = "0.1.1"
description = "What a host says about itself: name, uptime, boot id, kernel, OS, an app-specific machine id, and who its local accounts are."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
# Pure Rust rather than ring: CI keeps ring out of the default graph.
hmac = "0.12.1"
sha2 = "0.10.1"
uuid = { version = "1.1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.174"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# A named pipe to read the owner and client of.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
