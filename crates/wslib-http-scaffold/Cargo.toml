[package]
name = "wslib-http-scaffold"
version = "0.1.4"
description = "The HTTP scaffold under an axum app: its SPA, health and version routes, and the standard layers."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = ["server"]
# Everything but `BasePath`.
server = [
    "dep:axum",
    "dep:flate2",
    "dep:http-body",
    "dep:percent-encoding",
    "dep:serde_json",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:wslib-http-error",
]
embed = ["server", "dep:rust-embed"]

[dependencies]
serde = { version = "1.0.225", features = ["derive"] }
wslib-http-error = { path = "../wslib-http-error", version = "0.1", registry = "wired-square", optional = true }
axum = { version = "0.8.7", default-features = false, optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
http-body = { version = "1.0", optional = true }
percent-encoding = { version = "2.3", optional = true }
serde_json = { version = "1.0.85", optional = true }
tokio = { version = "1.47", default-features = false, features = ["sync"], optional = true }
tower = { version = "0.5.2", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "catch-panic"], optional = true }
rust-embed = { version = "8.5", features = ["mime-guess"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.10.1"
tokio = { version = "1.47", features = ["macros", "rt"] }
