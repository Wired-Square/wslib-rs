[package]
name = "wslib-http-server"
version = "0.1.4"
description = "The listeners under an axum app: HTTP, TLS with h1 and h2, a redirect to it, bounded and drained on a token."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
axum = { version = "0.8.7", default-features = false, features = ["tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
hyper-util = { version = "0.1.18", features = ["tokio", "server-auto", "http1", "http2"] }
# No provider: two in one binary leave `CryptoProvider::install_default`
# ambiguous, and rustls panics at the first handshake.
rustls = { version = "0.23.27", default-features = false }
tokio = { version = "1.47", features = ["macros", "net", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = { version = "0.7.19", default-features = false }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tracing = "0.1.41"

[target.'cfg(unix)'.dependencies]
libc = "0.2.174"
wslib-host = { path = "../wslib-host", version = "0.1.1", registry = "wired-square" }

[dev-dependencies]
h2 = "0.4.2"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.27", default-features = false, features = ["ring", "std"] }
tempfile = "3.10.1"
tokio = { version = "1.47", features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
