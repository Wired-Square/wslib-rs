[package]
name = "wslib-http"
version = "0.1.0"
description = "The HTTP scaffold under an axum app: its SPA, health and version routes, and the standard layers."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = []
embed = ["dep:rust-embed"]

[dependencies]
wslib-api-error = { path = "../wslib-api-error", version = "0.1", registry = "wired-square" }
axum = { version = "0.8", default-features = false }
percent-encoding = "2.3"
serde_json = "1.0.85"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "catch-panic"] }
rust-embed = { version = "8.5", features = ["mime-guess"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1.47", features = ["macros", "rt"] }
