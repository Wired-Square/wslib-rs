[package]
name = "wslib-instruments"
version = "0.4.0"
description = "Bench-instrument readers behind one blocking probe: the EEVblog 121GW over BLE and a WiredReflow board over CAN, each reading a FrameLink signal."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
ble = ["dep:btleplug", "dep:uuid", "dep:futures-util", "dep:tokio"]
can-slcan = ["dep:wslib-can", "dep:tokio", "wslib-can-bus/slcan"]
can-socketcan = ["dep:wslib-can", "dep:tokio", "wslib-can-bus/socketcan"]
can-gsusb = ["dep:wslib-can", "dep:tokio", "wslib-can-bus/gsusb"]
can-pcan = ["dep:wslib-can", "dep:tokio", "wslib-can-bus/pcan"]
can-gvret = ["dep:wslib-can", "dep:tokio", "wslib-can-bus/gvret"]
serde = ["dep:serde"]

[dependencies]
btleplug = { version = "0.13.5", optional = true }
futures-util = { version = "0.3.34", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt", "sync", "time"], optional = true }
uuid = { version = "1.26.1", default-features = false, optional = true }
wslib-can = { path = "../wslib-can", version = "0.1.2", registry = "wired-square", features = ["task"], optional = true }
wslib-can-bus = { path = "../wslib-can-bus", version = "0.2", registry = "wired-square" }
wslib-framelink-protocol = { path = "../wslib-framelink-protocol", version = "0.2.1", registry = "wired-square" }

[dev-dependencies]
serde_json = "1.0.85"
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time"] }
wslib-can-gvret = { path = "../wslib-can-gvret", version = "0.1", registry = "wired-square" }

[[test]]
name = "gvret"
required-features = ["can-gvret"]

[[test]]
name = "serde"
required-features = ["serde"]
