[package]
name = "wslib-isotp"
version = "0.2.1"
description = "ISO-TP (ISO 15765-2) over classic CAN and CAN FD with normal, extended or mixed addressing: a sans-IO codec, an async link over a wslib-can adapter, a passive tap, detection of ISO-TP traffic, and a simulated peer."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
link = ["dep:tokio", "dep:wslib-can", "wslib-can/task", "dep:windows-sys"]
testing = []
serde = ["dep:serde"]
ts = ["serde", "dep:ts-rs"]

[dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"], optional = true }
thiserror = "2.0.20"
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt", "sync", "time"], optional = true }
ts-rs = { version = "12", features = ["no-serde-warnings"], optional = true }
wslib-can = { path = "../wslib-can", version = "0.2", registry = "wired-square", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Media"], optional = true }

[dev-dependencies]
serde_json = "1.0.85"
tokio = { version = "1.53.3", features = ["macros", "rt", "sync", "test-util", "time"] }
wslib-can = { path = "../wslib-can", version = "0.2", registry = "wired-square", features = ["testing"] }

[[test]]
name = "link"
required-features = ["link"]

[[test]]
name = "responder"
required-features = ["link", "testing"]

[[test]]
name = "tap"
required-features = ["testing", "serde"]

[[test]]
name = "ts"
required-features = ["ts"]
