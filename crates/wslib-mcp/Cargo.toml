[package]
name = "wslib-mcp"
version = "0.1.0"
description = "Hosting layer over rmcp 3.x for Wired Square MCP tool servers: identity, tool-list cache hints, result helpers, and the Streamable-HTTP and stdio transports."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
rmcp = "3.4"
serde = "1"
serde_json = "1"
thiserror = "2"
tracing = "0.1"

axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
ipnet = { version = "2", optional = true }
tauri = { version = "2", default-features = false, optional = true }
tokio = { version = "1", default-features = false, optional = true }
tokio-util = { version = "0.7", optional = true }

[features]
default = []
http = ["dep:axum", "dep:ipnet", "dep:tokio", "tokio/net", "tokio/rt", "tokio/time", "tokio/macros", "dep:tokio-util", "rmcp/transport-streamable-http-server"]
stdio = ["dep:tokio", "tokio/net", "tokio/rt", "tokio/time", "tokio/macros", "rmcp/transport-io"]
dom = ["serde/derive"]
bridge = ["dep:tokio", "tokio/sync", "tokio/time"]
tauri-bridge = ["bridge", "dom", "dep:tauri"]

[dev-dependencies]
rmcp = { version = "3.4", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false, features = ["test"] }
tokio = { version = "1", features = ["full"] }

[[test]]
name = "http"
required-features = ["http"]

[[test]]
name = "stdio"
required-features = ["stdio"]

[[test]]
name = "dom"
required-features = ["dom", "stdio"]
