[package]
name = "wslib-mcu-flash"
version = "0.1.1"
description = "Chip families, USB-serial port resolution, firmware image parsing and the flash backends (esptool, dfu-util, espflash, USB DFU, STM32 AN3155) Wired Square tools share."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
ihex = "3"
thiserror = "2.0.20"

async-trait = { version = "0.1.7", optional = true }
dfu-nusb = { version = "0.1", optional = true }
espflash = { version = "4", default-features = false, features = ["serialport"], optional = true }
# `dfu-nusb` 0.1 pins nusb 0.1; consumers that also use nusb 0.2 alias this copy.
nusb = { version = "0.1.10", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serialport = { version = "4.7.2", features = ["usbportinfo-interface"], optional = true }
tokio = { version = "1.53.1", features = ["io-util", "process", "rt", "sync", "time"], optional = true }
wslib-file-atomic = { path = "../wslib-file-atomic", version = "0.1.6", registry = "wired-square", optional = true }

[features]
default = []
serde = ["dep:serde"]
ports = ["dep:serialport"]
esptool = ["dep:async-trait", "dep:tokio"]
dfu-util = ["dep:async-trait", "dep:tokio"]
espflash = ["dep:espflash", "dep:wslib-file-atomic", "ports"]
dfu = ["dep:dfu-nusb", "dep:nusb"]
stm32-uart = ["dep:wslib-file-atomic", "ports"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
