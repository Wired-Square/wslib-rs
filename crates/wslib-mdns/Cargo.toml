[package]
name = "wslib-mdns"
version = "0.1.0"
description = "DNS-SD on the local network: validated service names, adverts that withdraw on drop, an in-process responder and browser over mdns-sd, avahi over D-Bus, and a fake avahi for tests."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
in-process = ["dep:mdns-sd", "dep:libc", "tokio/rt"]
avahi = ["dep:zbus", "dep:futures-util", "tokio/rt"]
testing = ["avahi", "zbus/p2p", "tokio/macros", "tokio/net"]

[dependencies]
futures-util = { version = "0.3.30", default-features = false, optional = true }
mdns-sd = { version = "0.21.6", default-features = false, features = ["async"], optional = true }
tokio = { version = "1.37", default-features = false, features = ["sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2.183", optional = true }

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt", "time"] }

[[test]]
name = "avahi"
required-features = ["testing"]

[[test]]
name = "in_process"
required-features = ["in-process"]
