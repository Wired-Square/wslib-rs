[package]
name = "wslib-modbus"
version = "0.2.2"
description = "Modbus: the wire facts, a TOML register map decoded and encoded, poll schedules on the caller's clock, a register sweep's plan, Modbus RTU framed and stamped off a serial line, and a Modbus TCP client, poller and poll task with writes behind their own feature."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
tcp = ["dep:tokio", "dep:tokio-modbus", "dep:wslib-tcp"]
task = ["tcp", "tokio/rt", "tokio/sync", "tokio/macros"]
write = ["tcp"]
testing = ["tcp", "tokio/rt", "tokio/sync", "tokio/macros", "tokio/io-util", "tokio/net"]
ts = ["dep:ts-rs", "wslib-bits/ts"]

[dependencies]
rust_decimal = { version = "1.42", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.85"
thiserror = "2.0.20"
tokio = { version = "1.53.3", default-features = false, features = ["time"], optional = true }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"], optional = true }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
ts-rs = { version = "12", features = ["no-serde-warnings"], optional = true }
wslib-backoff = { path = "../wslib-backoff", version = "0.1.2", registry = "wired-square" }
wslib-bits = { path = "../wslib-bits", version = "0.1", registry = "wired-square", features = ["decimal", "display"] }
wslib-checksum = { path = "../wslib-checksum", version = "0.1", registry = "wired-square" }
wslib-tcp = { path = "../wslib-tcp", version = "0.1", registry = "wired-square", optional = true }

[dev-dependencies]
rust_decimal_macros = "1.40"
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt", "test-util", "time"] }

[[test]]
name = "poller"
required-features = ["tcp"]

[[test]]
name = "tcp"
required-features = ["tcp"]

[[test]]
name = "write"
required-features = ["write"]

[[test]]
name = "task"
required-features = ["task"]

[[test]]
name = "task_write"
required-features = ["task", "write"]

[[test]]
name = "testing"
required-features = ["testing", "write"]

[[test]]
name = "ts"
required-features = ["ts"]
