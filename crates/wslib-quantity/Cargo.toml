[package]
name = "wslib-quantity"
version = "0.2.0"
description = "A measured value and its unit: tolerant unit parsing, exact conversion, auto-scaling and display precision, in rust_decimal."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
rust_decimal = { version = "1.42", default-features = false, features = ["std"] }

[dev-dependencies]
rust_decimal_macros = "1.40"
serde_json = "1.0.85"
