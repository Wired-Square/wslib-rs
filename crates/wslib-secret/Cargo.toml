[package]
name = "wslib-secret"
version = "0.1.4"
description = "A credential that never prints itself, loaded from the environment or a file."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = []
serde = ["dep:serde"]
# 11, not 12: a `Secret` field only satisfies the `TS` trait of the ts-rs its
# container derives with, and the chassis is on 11.
ts = ["dep:ts-rs"]
token = ["dep:getrandom", "dep:sha2"]
keychain = ["dep:security-framework"]

[dependencies]
getrandom = { version = "0.3", features = ["std"], optional = true }
sha2 = { version = "0.10.9", optional = true }
subtle = { version = "2.5", default-features = false }
serde = { version = "1.0.225", optional = true }
ts-rs = { version = "11.1", optional = true }
zeroize = { version = "1.8.1", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3.0", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0.85"
