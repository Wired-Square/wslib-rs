[package]
name = "wslib-systemd-notify"
version = "0.1.0"
description = "Tells systemd a service is ready, stopping or alive over $NOTIFY_SOCKET, without libsystemd."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
tokio = ["dep:tokio"]

[dependencies]
tokio = { version = "1.19", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1.19", features = ["macros", "rt", "sync", "test-util", "time"] }
