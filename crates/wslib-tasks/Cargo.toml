[package]
name = "wslib-tasks"
version = "0.1.0"
description = "Long-lived tasks, one per row of a desired set, kept in step with it: started, stopped and restarted on change."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
tokio = { version = "1.47", default-features = false, features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7.14", default-features = false }
tracing = "0.1.41"

[dev-dependencies]
tokio = { version = "1.47", features = ["macros", "rt", "sync", "test-util", "time"] }
wslib-telemetry = { path = "../wslib-telemetry", version = "0.1.5", registry = "wired-square", default-features = false, features = ["test-support"] }
