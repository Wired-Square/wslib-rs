[package]
name = "wslib-tauri"
version = "0.1.0"
description = "Tauri desktop-app pieces: a quit that waits for in-flight work before exiting."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[dependencies]
tauri = { version = "2.10", default-features = false }

[dev-dependencies]
tauri = { version = "2.10", default-features = false, features = ["test"] }

[[test]]
name = "macos_quit_menu"
harness = false
