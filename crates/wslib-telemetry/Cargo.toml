[package]
name = "wslib-telemetry"
version = "0.1.0"
description = "One tracing setup for daemons and command lines, and an in-memory ring of a service's own log."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
default = ["setup", "ansi"]
setup = ["dep:tracing", "dep:tracing-subscriber", "tracing-subscriber/fmt", "tracing-subscriber/env-filter"]
ansi = ["setup", "tracing-subscriber/ansi"]
json = ["setup", "tracing-subscriber/json"]
journald = ["setup"]
# Serde, chrono and nothing else, for a crate that only carries the records.
types = ["dep:serde", "dep:chrono"]
ring = ["types", "dep:tracing", "dep:tracing-subscriber", "tracing-subscriber/registry", "dep:tokio", "chrono/now"]
# 11, not 12: the chassis derives with 11, and a field's `TS` must come from the
# same ts-rs as its container's.
ts = ["types", "dep:ts-rs"]
test-support = ["ring"]

[dependencies]
tracing = { version = "0.1.39", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std"], optional = true }
tokio = { version = "1.47", default-features = false, features = ["sync"], optional = true }
chrono = { version = "0.4.39", default-features = false, features = ["serde"], optional = true }
serde = { version = "1.0.225", features = ["derive", "rc"], optional = true }
ts-rs = { version = "11.1", features = ["chrono-impl"], optional = true }

[dev-dependencies]
serde_json = "1.0.85"
tokio = { version = "1.47", default-features = false, features = ["macros", "rt", "sync"] }
