[package]
name = "wslib-tls"
version = "0.1.0"
description = "Outbound TLS trust over the caller's rustls CryptoProvider: OS roots, CA anchors and pins by host, reloaded live, with typed rejections and a look-first probe."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
# Loopback peers for tests: an authority, a self-signed pair and a TLS listener.
testing = ["dep:rcgen", "tokio/io-util"]

[dependencies]
http = "1.1"
rcgen = { version = "0.14.10", default-features = false, optional = true }
# No provider: the caller's verifies, and two in one binary panic at the first handshake.
rustls = { version = "0.23.27", default-features = false, features = ["std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1.12", features = ["std"] }
thiserror = "2"
tokio = { version = "1.47", default-features = false, features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing = "0.1.41"
wslib-crypto = { version = "0.1", path = "../wslib-crypto", registry = "wired-square" }
wslib-crypto-x509 = { version = "0.1", path = "../wslib-crypto-x509", registry = "wired-square" }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false }
rustls = { version = "0.23.27", default-features = false, features = ["aws_lc_rs", "ring", "std", "tls12"] }
tokio = { version = "1.47", features = ["io-util", "macros", "rt-multi-thread", "time"] }
