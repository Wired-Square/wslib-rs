[package]
name = "wslib-wiretap-catalogue"
version = "0.3.1"
description = "WireTAP-format device catalogues (TOML) across CAN, Serial and Modbus: parse, validate, decode, edit and migrate, mirrors, serial framing and its detection, summaries, and DBC import and export."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
ts = ["dep:ts-rs", "wslib-bits/ts", "wslib-modbus/ts"]

[dependencies]
can-dbc = { version = "8.1", default-features = false }
rust_decimal = { version = "1.42", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.85"
thiserror = "2.0.20"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
toml_edit = { version = "0.25", default-features = false, features = ["display", "parse"] }
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
wslib-bits = { path = "../wslib-bits", version = "0.1", registry = "wired-square", features = ["decimal", "display"] }
wslib-checksum = { path = "../wslib-checksum", version = "0.1", registry = "wired-square" }
wslib-modbus = { path = "../wslib-modbus", version = "0.2.1", registry = "wired-square", default-features = false }
wslib-quantity = { path = "../wslib-quantity", version = "0.2.0", registry = "wired-square" }
wslib-serial = { path = "../wslib-serial", version = "0.1", registry = "wired-square", default-features = false }
wslib-wiretap-protocol = { path = "../wslib-wiretap-protocol", version = "0.2", registry = "wired-square" }

[dev-dependencies]
rust_decimal_macros = "1.40"
wslib-wiretap-gateway = { path = "../wslib-wiretap-gateway", version = "0.2", registry = "wired-square" }

[[ test ]]
name = "ts"
required-features = ["ts"]

[[ test ]]
name = "ts_edit"
required-features = ["ts"]

[[ test ]]
name = "ts_serial_framing"
required-features = ["ts"]
