[package]
name = "wslib-wiretap-gateway"
version = "0.2.0"
description = "The WireTAP gateway's HTTP API as serde types: query results, the archive, events and admin endpoints, the request bodies and query strings, and a query spec with the request that asks it; an HTTP client behind the `client` feature."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = ["wired-square"]

[features]
ts = ["dep:ts-rs", "wslib-wiretap-protocol/ts"]
client = ["dep:reqwest", "dep:serde_json", "dep:wslib-bits", "dep:wslib-can"]

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["json"], optional = true }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = { version = "1.0.85", optional = true }
ts-rs = { version = "12", optional = true, features = ["no-serde-warnings"] }
wslib-bits = { path = "../wslib-bits", version = "0.1", registry = "wired-square", optional = true }
wslib-can = { path = "../wslib-can", version = "0.1.1", registry = "wired-square", optional = true }
wslib-wiretap-protocol = { path = "../wslib-wiretap-protocol", version = "0.2", registry = "wired-square" }

[dev-dependencies]
serde_json = "1.0.85"
tokio = { version = "1.53.3", features = ["macros", "rt", "time"] }

[[test]]
name = "ts"
required-features = ["ts"]

[[test]]
name = "client"
required-features = ["client"]
